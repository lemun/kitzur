<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How Kitzur compacts a coding-agent request</title><desc id="desc">A coding agent sends a long context through Kitzur to a local LLM server. Kitzur extracts a structured summary from older history, keeps recent messages and tool results, and trims oversized outputs. The forwarded prompt shares the model context window with reserved output space. Layout is illustrative and retention is budget-limited.</desc><rect width="1600" height="800" rx="24" fill="#F8FAFC"/><text x="64" y="74" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#526174">LONG SESSION. SMALLER REQUEST.</text><text x="64" y="132" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#141923">How Kitzur works</text><text x="64" y="219" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141923">Coding agent</text><text x="572" y="219" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141923">Kitzur proxy</text><text x="1192" y="219" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141923">Local LLM</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526174">Long context</text><text x="572" y="260" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526174">Deterministic compaction</text><text x="1192" y="260" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526174">Model server</text><path d="M425 230H536m-12 -8 12 8-12 8" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1065 230H1154m-12 -8 12 8-12 8" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="291" width="350" height="353" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="88" y="329" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#526174">Earlier history</text><rect x="88" y="350" width="278" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="377" width="234" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="404" width="278" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="431" width="199" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="458" width="258" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="485" width="225" height="11" rx="5" fill="#BEB1DB"/><rect x="88" y="535" width="302" height="83" rx="9" fill="#E0F5EE"/><text x="106" y="569" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#136B59">Recent messages</text><text x="106" y="600" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#136B59">+ tool results</text><rect x="550" y="291" width="500" height="353" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="576" y="326" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6248C8">01</text><text x="623" y="326" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#141923">Extract a structured summary</text><text x="623" y="362" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174">Instructions, decisions, open todos</text><text x="576" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6248C8">02</text><text x="623" y="426" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#141923">Keep recent work</text><text x="623" y="462" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174">Recent messages and tool results</text><text x="576" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6248C8">03</text><text x="623" y="526" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#141923">Trim oversized outputs</text><text x="623" y="562" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174">Fit the configured prompt budget</text><rect x="1180" y="291" width="356" height="353" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1204" y="329" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#526174">Context window</text><rect x="1204" y="350" width="308" height="49" rx="8" fill="#EDF2F7"/><text x="1220" y="382" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#141923">Head messages + tools</text><rect x="1204" y="410" width="308" height="62" rx="8" fill="#EEE9FF"/><text x="1220" y="448" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#6248C8">Structured summary</text><rect x="1204" y="483" width="308" height="62" rx="8" fill="#E0F5EE"/><text x="1220" y="521" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#136B59">Recent work</text><rect x="1204" y="558" width="308" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/><text x="1220" y="596" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526174">Reserved output space</text><path d="M64 685H1536" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="729" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#141923">Local extraction and trimming. No model call for compaction.</text><text x="64" y="767" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526174">Illustrative layout. Retention is budget-limited; compaction can shorten content.</text></svg>