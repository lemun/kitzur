name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Download development tokenizer
        run: scripts/fetch-tokenizer.sh
      - run: npm test -- --test-concurrency=2
  estimate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test without the development tokenizer
        env:
          KITZUR_TEST_TOKENIZER: /nonexistent
        run: npm test -- --test-concurrency=2
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build clean offline, npm and Windows distributions
        run: python3 scripts/pack-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-distribution
          path: |
            dist/offline/*-windows.zip
            dist/offline/*.tgz
          if-no-files-found: error
  windows:
    needs: package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Download and verify development tokenizer
        shell: bash
        run: scripts/fetch-tokenizer.sh
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: windows-distribution
          path: distribution
      - name: Extract actual ZIP and install npm package into a path with spaces
        shell: pwsh
        run: |
          $zip = (Get-ChildItem distribution/*-windows.zip).FullName
          $extract = Join-Path $env:RUNNER_TEMP 'Kitzur Distribution Spaces'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $bundle = (Get-ChildItem $extract -Directory).FullName
          "KITZUR_TEST_WINDOWS_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append
          $prefix = Join-Path $env:RUNNER_TEMP 'Kitzur Package Spaces'
          $tgz = (Get-ChildItem distribution/*.tgz).FullName
          npm install --offline --ignore-scripts --no-audit --no-fund --prefix $prefix $tgz
          if ($LASTEXITCODE -ne 0) { throw 'npm package installation failed' }
          $cli = Join-Path $prefix 'node_modules/kitzur/dist/src/cli.js'
          node $cli version
          if ($LASTEXITCODE -ne 0) { throw 'packaged CLI version failed' }
          node $cli config validate --preset 32k --upstream http://127.0.0.1:1
          if ($LASTEXITCODE -ne 0) { throw 'packaged preset/config validation failed' }
          node $cli doctor --json --preset 32k --upstream http://127.0.0.1:1
          if ($LASTEXITCODE -ne 0) { throw 'packaged offline doctor failed' }
          $stats = Join-Path $prefix 'empty stats.jsonl'
          [IO.File]::WriteAllText($stats, '')
          node $cli report --json $stats
          if ($LASTEXITCODE -ne 0) { throw 'packaged empty report failed' }
      - name: Per-user autostart shortcut and port guard
        shell: pwsh
        run: |
          node --test dist/test/cli/autostart.test.js
          if ($LASTEXITCODE -ne 0) { throw 'autostart unit tests failed' }
          $cli = (Resolve-Path dist/src/cli.js).Path
          $dir = Join-Path $env:RUNNER_TEMP "Kitzur Autostart O'Brien"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $config = Join-Path $dir 'kitzur config.json'
          @{ preset = '32k'; upstream = @{ origin = 'http://127.0.0.1:1' }; listen = @{ host = '127.0.0.1'; port = 18977 }; stateDir = (Join-Path $dir 'state') } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $config
          node $cli autostart install --config $config
          if ($LASTEXITCODE -ne 0) { throw 'autostart install failed' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'Kitzur.lnk'
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($link.TargetPath -ne (Get-Command node).Source) { throw "unexpected TargetPath $($link.TargetPath)" }
          if ($link.Arguments -ne "`"$cli`" autostart run --config `"$config`"") { throw "unexpected Arguments $($link.Arguments)" }
          if ($link.WindowStyle -ne 7) { throw 'shortcut is not minimised' }
          $status = node $cli autostart status --config $config | Out-String
          if ($status -notmatch 'TargetPath: ') { throw "unexpected status $status" }
          node $cli autostart run --config $config
          if ($LASTEXITCODE -ne 0) { throw 'first guard run failed' }
          for ($i = 0; $i -lt 60 -and -not (Get-NetTCPConnection -LocalPort 18977 -State Listen -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          $second = node $cli autostart run --config $config | Out-String
          if ($LASTEXITCODE -ne 0 -or $second -notmatch 'already running') { throw "second guard run did not find the instance: $second" }
          Get-NetTCPConnection -LocalPort 18977 -State Listen | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }
          node $cli autostart remove --config $config
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $lnk)) { throw 'autostart remove left Kitzur.lnk behind' }
      - name: Portable compaction, ledger, tokenizer and diagnostics suites
        run: node scripts/run-tests.mjs --test-concurrency=2 dist/test/engine dist/test/ledger dist/test/summary dist/test/rules dist/test/tokenize dist/test/diagnostics
      - name: Windows distribution, PowerShell installation and lifecycle
        run: node scripts/run-tests.mjs --test-concurrency=1 dist/test/windows
