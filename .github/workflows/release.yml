name: Release
# Builds the release assets for a version tag and creates a DRAFT GitHub release with them.
# This workflow never publishes: nothing is uploaded to the npm registry and the release is never marked as published.
# A person reviews the draft (notes, assets, SHA256SUMS), then publishes the release and the npm package by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v1.2.3
        required: true
permissions:
  contents: read
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG does not match package.json version $version" >&2; exit 1; fi
      - name: CHANGELOG.md has a section for the version
        run: node scripts/release-notes.mjs "$TAG" > /dev/null
      - run: npm ci
      - run: npm run build
      - run: npm run --if-present check:pack
  bundles:
    needs: verify
    runs-on: ubuntu-latest
    # GNU tar, sha256sum, git and python3 come with the full node image
    container: node:22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Offline bundle and npm package
        # pack-offline.sh runs `npm pack` on the clean build, writing kitzur-<version>.tgz next to the bundle
        run: bash scripts/pack-offline.sh dist/release
      - name: Windows bundle
        run: python3 scripts/pack-windows.py --out dist/release
      - name: SBOM
        run: |
          version=$(node -p "require('./package.json').version")
          npm run --if-present sbom -- --out "dist/release/kitzur-$version.cdx.json"
      - name: Checksums over all assets
        working-directory: dist/release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
  draft:
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create the draft release (a person publishes it after review)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md assets/*
